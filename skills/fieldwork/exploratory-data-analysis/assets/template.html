<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>{{title}}: exploratory data analysis</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafaf9; color: #1e293b; font: 15px/1.65 system-ui, sans-serif; }
    main { max-width: 1120px; margin: auto; padding: 48px 28px 80px; }
    header { border-top: 4px solid #4f46e5; padding-top: 24px; }
    h1, h2, h3 { line-height: 1.25; color: #0f172a; }
    h1 { font-size: 32px; margin: 8px 0 16px; overflow-wrap: anywhere; }
    h2 { font-size: 23px; margin-bottom: 20px; }
    h3 { font-size: 18px; }
    section { margin-top: 44px; }
    .overview, .observation { margin: 32px 0; }
    .overview figure, .observation figure { margin-top: 16px; }
    p { overflow-wrap: anywhere; }
    .eyebrow { color: #4f46e5; font-size: 16px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .lede { font-size: 18px; margin: 0 0 12px; }
    .facts { font-size: 22px; font-variant-numeric: tabular-nums; margin: 8px 0; }
    .muted { color: #64748b; }
    .scroll-table, .scroll-chart { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; vertical-align: top; padding: 11px 12px; border-bottom: 1px solid #e2e8f0; }
    td { max-width: 420px; overflow-wrap: break-word; }
    th { text-align: center; color: #475569; background: #f1f5f9; }
    table.quality { table-layout: fixed; min-width: 640px; }
    table.quality th:nth-child(1) { width: 22%; }
    table.quality th:nth-child(2) { width: 30%; }
    table.quality th:nth-child(3) { width: 12%; }
    table.quality th:nth-child(4) { width: 36%; }
    caption { text-align: left; font-weight: 600; margin: 12px 0; }
    details { margin: 12px 0; }
    summary { color: #64748b; cursor: pointer; }
    figure { margin: 24px 0 0; }
    figcaption { font-weight: 600; margin-bottom: 10px; }
    svg { width: 100%; min-width: 640px; display: block; }
    svg text { font: 13px system-ui, sans-serif; fill: #475569; }
    /* Pie slices in order: Okabe-Ito colors, distinguishable with common color-vision deficiencies. */
    .slice-1 { fill: #0072b2; } .slice-2 { fill: #e69f00; } .slice-3 { fill: #009e73; }
    .slice-4 { fill: #d55e00; } .slice-5 { fill: #cc79a7; }
    @media (max-width: 600px) { main { padding: 24px 16px; } h1 { font-size: 26px; } }
    @media print { body { background: white; } main { padding: 0; } .overview, .observation { break-inside: avoid; } .scroll-table { overflow: visible; } }
  </style>
</head>
<body><main>
{{body}}
</main></body>
</html>
