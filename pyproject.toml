[project]
name = "internal-audit-skills"
version = "0.1.1"
description = "Development environment for the skills' scripts and their tests."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pandas>=2.0,<4",
    "openpyxl>=3.1.5,<4",
    "pillow>=10",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
